<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de Injetáveis — Técnica & Cuidado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1a14; --paper:#f6f8f5; --paper2:#eef2ec;
  --green-dk:#123524; --green:#166534; --green-lt:#2f8f5b;
  --gold:#c9971f; --gold-lt:#f4e6bf;
  --muted:#5b6b62; --line:#dbe4dc;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Fraunces',serif;}

/* ===== HEADER ===== */
header{
  background:linear-gradient(135deg,var(--green-dk),var(--green));
  color:#fff;
  padding:22px 24px 20px 24px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute; right:-40px; top:-40px;
  width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle, rgba(201,151,31,0.35), transparent 70%);
}
.headtop{display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1;}
.brand{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-lt); font-weight:700;}
h1{font-size:26px; margin:4px 0 2px 0; font-weight:700; letter-spacing:-0.3px;}
.sub{font-size:13px; color:#dcecdf; margin:0;}
.stat-pill{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.stat-pill b{color:var(--gold-lt); font-size:15px; margin-right:4px;}

/* ===== LAYOUT ===== */
.wrap{display:flex; flex:1; min-height:0;}
aside{
  width:340px; min-width:280px; flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  min-height:0;
}
.searchbox{padding:14px; border-bottom:1px solid var(--line);}
.searchbox input{
  width:100%; padding:10px 12px 10px 36px;
  border:1.5px solid var(--line); border-radius:10px;
  font-size:14px; font-family:inherit; color:var(--ink);
  background:var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%235b6b62" stroke-width="2"><circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="15" y2="15"/></svg>') no-repeat 11px center;
  outline:none;
}
.searchbox input:focus{border-color:var(--green-lt); box-shadow:0 0 0 3px rgba(47,143,91,0.15);}
.catbar{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 12px 14px; border-bottom:1px solid var(--line);}
.catchip{
  font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px;
  border:1.3px solid var(--line); background:#fff; color:var(--muted);
  cursor:pointer; transition:.15s;
}
.catchip:hover{border-color:var(--green-lt);}
.catchip.active{background:var(--green); border-color:var(--green); color:#fff;}
.counter{padding:10px 14px; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.3px; text-transform:uppercase;}
.list{overflow-y:auto; flex:1; padding:0 8px 16px 8px;}
.item{
  display:flex; align-items:center; gap:10px;
  padding:10px 10px; border-radius:10px; cursor:pointer;
  border:1px solid transparent;
}
.item:hover{background:var(--paper2);}
.item.active{background:var(--gold-lt); border-color:var(--gold);}
.dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.itemtext{min-width:0;}
.itemname{font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.itemcat{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.empty-list{padding:24px 16px; color:var(--muted); font-size:13px; text-align:center;}

/* ===== MAIN DETAIL ===== */
main{flex:1; overflow-y:auto; padding:28px 34px; min-height:0;}
.placeholder{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--muted); text-align:center; gap:8px;
}
.placeholder .picon{font-size:44px; margin-bottom:6px;}
.placeholder h2{font-size:20px; color:var(--ink); margin:0;}
.placeholder p{font-size:13.5px; max-width:340px; margin:0;}
.kbd{background:#fff; border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-family:monospace; font-size:12px;}

.detail{max-width:760px;}
.dhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px;}
.dbadge{display:inline-block; color:#fff; font-size:11.5px; font-weight:700; letter-spacing:.3px; padding:5px 12px; border-radius:20px; margin-bottom:10px;}
.dtitle{font-size:34px; font-weight:700; letter-spacing:-0.5px; margin:0 0 14px 0; line-height:1.05;}
.dind{font-size:14.5px; color:var(--green-dk); font-weight:600; background:var(--paper2); border-left:3px solid var(--green); padding:8px 12px; border-radius:0 8px 8px 0; margin-bottom:22px;}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px;}
.gcard{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
.gcard .glabel{font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
.gcard .gval{font-size:15px; font-weight:700; color:var(--ink); line-height:1.35;}
.gcard .gsub{font-size:12px; color:var(--muted); font-style:italic; margin-top:2px;}
.gcard.wide{grid-column:1 / -1;}

.tip{
  background:var(--gold-lt); border:1px solid #e6cd85; border-radius:12px;
  padding:12px 16px; margin-bottom:24px; font-size:13.5px; color:#5a4207;
}
.tip b{display:block; font-size:11px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:3px; color:#8a6a10;}

.sect{margin-bottom:20px;}
.sect h3{font-size:14px; letter-spacing:.3px; text-transform:uppercase; margin:0 0 10px 0; display:flex; align-items:center; gap:6px;}
.sect ul{margin:0; padding-left:18px;}
.sect li{font-size:14px; line-height:1.55; margin-bottom:5px; color:#1f2d25;}
.sect p{font-size:14px; line-height:1.55; margin:0; color:#1f2d25;}
.disclaimer{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); text-align:center;}

@media (max-width:820px){
  .wrap{flex-direction:column;}
  aside{width:100%; max-height:46vh;}
  main{padding:20px;}
  .dtitle{font-size:26px;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
  <div class="headtop">
    <div>
      <div class="brand">Técnica &amp; Cuidado</div>
      <h1>Guia de Injetáveis</h1>
      <p class="sub">Consulta rápida — diluição, via, tempo de infusão e cuidados de enfermagem</p>
    </div>
    <div class="stat-pill"><b id="totalCount">108</b>medicamentos</div>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="searchbox">
      <input id="search" type="text" placeholder="Buscar medicamento..." autocomplete="off">
    </div>
    <div class="catbar" id="catbar"></div>
    <div class="counter" id="counter">108 medicamentos</div>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div id="content">
      <div class="placeholder">
        <div class="picon">💉</div>
        <h2>Selecione um medicamento</h2>
        <p>Busque pelo nome à esquerda ou filtre por categoria. Pressione <span class="kbd">/</span> para focar a busca.</p>
      </div>
    </div>
  </main>
</div>

// group into broad categories for the filter bar (by keyword in cat)
function broadGroup(cat){
  const c = cat.toUpperCase();
  if(c.includes('ANTIBIÓTICO')) return 'Antibióticos';
  if(c.includes('ANTIFÚNGICO')) return 'Antifúngicos';
  if(c.includes('QUIMIOTER')) return 'Quimioterápicos';
  if(c.includes('ANTÍDOTO')) return 'Antídotos';
  if(c.includes('SEDATIVO')||c.includes('BENZODIAZEP')||c.includes('BLOQUEADOR NEURO')||c.includes('INDUÇÃO')||c.includes('ANESTÉ')) return 'Sedação/IOT';
  if(c.includes('VASOPRESSOR')||c.includes('INOTRÓPICO')||c.includes('ANTIARRÍTMICO')||c.includes('BETABLOQUEADOR')||c.includes('DIGITÁLICO')||c.includes('VASODILATADOR')||c.includes('ANTI-HIPERTENSIVO')||c.includes('TROMBOLÍTICO')||c.includes('ANTIAGREGANTE')) return 'Cardiovascular';
  if(c.includes('BRONCODILATADOR')||c.includes('CORTICOIDE')) return 'Respiratório';
  if(c.includes('UTEROTÔNICO')) return 'Obstetrícia';
  if(c.includes('ANTIEMÉTICO')||c.includes('BOMBA DE PRÓTONS')||c.includes('ANTAGONISTA H2')||c.includes('ANTISSECRETOR')||c.includes('ANTIESPASM')) return 'Gastro';
  if(c.includes('ANTICOAGULANTE')||c.includes('ANTIFIBRINOLÍTICO')) return 'Anticoagulantes';
  if(c.includes('ANTICONVULSIVANTE')) return 'Neurológico';
  if(c.includes('ELETRÓLITO')||c.includes('GLICÊMIC')||c.includes('CORRETOR METABÓLICO')||c.includes('OSMÓTICO')) return 'Metabólico';
  if(c.includes('ANALGÉSICO')||c.includes('ANTI-INFLAMAT')||c.includes('ANTITÉRMICO')) return 'Analgesia';
  if(c.includes('ANTIPSICÓTICO')) return 'Psiquiatria';
  return 'Outros';
}
DRUGS.forEach(d => d._group = broadGroup(d.cat));

const groups = [...new Set(DRUGS.map(d=>d._group))].sort();
const catbar = document.getElementById('catbar');
let activeGroup = null;
function renderChips(){
  catbar.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'catchip' + (activeGroup===null?' active':'');
  all.textContent = 'Todos';
  all.onclick = () => { activeGroup=null; renderChips(); renderList(); };
  catbar.appendChild(all);
  groups.forEach(g=>{
    const el = document.createElement('div');
    el.className = 'catchip' + (activeGroup===g?' active':'');
    el.textContent = g;
    el.onclick = () => { activeGroup = (activeGroup===g?null:g); renderChips(); renderList(); };
    catbar.appendChild(el);
  });
}

const listEl = document.getElementById('list');
const counterEl = document.getElementById('counter');
let activeName = null;

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let items = DRUGS.filter(d=>{
    const matchQ = !q || d.name.toLowerCase().includes(q) || d.ind.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q);
    const matchG = !activeGroup || d._group===activeGroup;
    return matchQ && matchG;
  });
  items = items.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  counterEl.textContent = items.length + (items.length===1 ? ' medicamento' : ' medicamentos');
  listEl.innerHTML = '';
  if(items.length===0){
    listEl.innerHTML = '<div class="empty-list">Nenhum medicamento encontrado.</div>';
    return;
  }
  items.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'item' + (d.name===activeName?' active':'');
    el.innerHTML = `<span class="dot" style="background:${d.color}"></span>
      <div class="itemtext">
        <div class="itemname">${d.name}</div>
        <div class="itemcat">${d.cat}</div>
      </div>`;
    el.onclick = () => selectDrug(d.name);
    listEl.appendChild(el);
  });
}

function selectDrug(name){
  const d = DRUGS.find(x=>x.name===name);
  if(!d) return;
  activeName = name;
  const content = document.getElementById('content');
  const viaO = d.via_o || '—';
  const recon = d.recon || '—';
  const viaSub = d.via_p_label ? `<div class="gsub">${d.via_p_label}</div>` : '';
  content.innerHTML = `
    <div class="detail">
      <span class="dbadge" style="background:${d.color}">${d.cat}</span>
      <h2 class="dtitle disp">${d.name}</h2>
      <div class="dind">🎯 ${d.ind}</div>
      <div class="grid">
        <div class="gcard"><div class="glabel">Via principal</div><div class="gval" style="color:${d.color}">${d.via_p}</div>${viaSub}</div>
        <div class="gcard"><div class="glabel">Outras vias</div><div class="gval">${viaO}</div></div>
        <div class="gcard"><div class="glabel">Reconstituição</div><div class="gval">${recon}</div></div>
        <div class="gcard"><div class="glabel">Tempo de infusão</div><div class="gval">${d.tempo}</div></div>
        <div class="gcard wide"><div class="glabel">Diluição</div><div class="gval">${d.dil}</div></div>
      </div>
      <div class="tip"><b>💡 Lembre-se</b>${d.lembre}</div>
      <div class="sect">
        <h3 style="color:#b45309">⚠️ Cuidados</h3>
        <ul>${d.cuidados.map(c=>`<li>${c}</li>`).join('')}</ul>
      </div>
      <div class="sect">
        <h3 style="color:#1e3a8a">📋 Observações</h3>
        <p>${d.obs}</p>
      </div>
      <div class="sect">
        <h3 style="color:#15803d">⭐ Dica prática</h3>
        <p>${d.dica}</p>
      </div>
      <div class="disclaimer">Material de estudo — não substitui a prescrição médica nem o protocolo institucional.</div>
    </div>`;
  renderList();
  window.scrollTo(0,0);
  document.querySelector('main').scrollTo(0,0);
}

document.getElementById('search').addEventListener('input', renderList);
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.id!=='search'){
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

renderChips();
renderList();
</script>
